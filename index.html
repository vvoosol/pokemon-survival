<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>과학자 RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="gameRoot" class="game-root">
    <section id="screenFrame" class="screen-frame" aria-label="과학자 RPG 게임 화면">
      <canvas id="gameCanvas" width="1280" height="720" aria-label="게임 필드"></canvas>

      <button id="fullscreenBtn" class="fullscreen-button" type="button" aria-label="전체화면 전환">
        전체화면
      </button>

      <div class="player-hud" aria-label="현재 포켓몬 상태">
        <div class="hud-title">
          <strong id="playerName">이상해씨</strong>
          <span id="playerLevel">Lv.5</span>
        </div>
        <span id="playerMode" class="player-mode">트레이너</span>
        <div class="databox-hp"><div id="hpFill"></div></div>
        <div class="databox-exp"><div id="expFill"></div></div>
      </div>

      <div class="move-hud">
        <div id="moveCooldownList" class="move-cooldown-list" aria-label="Move cooldowns"></div>
      </div>

      <div id="collectionPanel" class="collection-panel" hidden></div>
      <div id="partyPanel" class="party-panel" aria-label="파티 포켓몬"></div>

      <div id="levelToast" class="level-toast" hidden>LEVEL UP!</div>
      <div id="messageBox" class="message-box" hidden></div>

      <div id="levelChoiceOverlay" class="level-choice-overlay" hidden>
        <section class="level-choice-box" aria-label="Level up choices">
          <p class="choice-eyebrow">LEVEL UP!</p>
          <h1 id="choiceTitle">이상해씨 Lv.6</h1>
          <div id="choiceCards" class="choice-cards"></div>
        </section>
      </div>

      <div id="mainMenuOverlay" class="menu-overlay" hidden>
        <section class="menu-window" aria-label="Pokemon game menu">
          <div id="menuRoot"></div>
        </section>
      </div>

      <div id="survivalHud" class="survival-hud" hidden></div>
      <div id="survivalResult" class="game-over" hidden>
        <div class="game-over-box">
          <h1>15분 생존 성공!</h1>
          <p id="survivalResultStats"></p>
          <button id="survivalReturnBtn" type="button">허브로 돌아가기</button>
        </div>
      </div>
      <div id="debugPanel" class="debug-panel" hidden></div>
      <div id="bootStatus" class="boot-status">게임을 불러오는 중...</div>

      <div id="gameOver" class="game-over" hidden>
        <div class="game-over-box">
          <h1>더 싸울 수 있는 포켓몬이 없습니다!</h1>
          <button id="restartBtn" type="button">다시 시작</button>
        </div>
      </div>

      <div class="gameboy-controls" aria-label="Game Boy controls">
        <div class="touch-zone" aria-label="Virtual d-pad">
          <div id="joystick" class="joystick">
            <div id="joystickKnob" class="joystick-knob"></div>
          </div>
        </div>

        <div class="face-buttons" aria-label="Action buttons">
          <button id="switchActionBtn" class="gb-button z-button" type="button">
            <strong>Z</strong>
            <span id="switchActionLabel">YES</span>
          </button>
          <button id="ballActionBtn" class="gb-button x-button" type="button">
            <strong>X</strong>
            <span id="xActionLabel">NO</span>
          </button>
          <span class="ball-counter" aria-label="보유 몬스터볼">
            <img src="assets/items/pokeball.png" alt="">
            <strong id="ballCount">x10</strong>
          </span>
        </div>

        <div class="system-buttons" aria-label="Menu buttons">
          <button id="partyActionBtn" class="system-button" type="button">SELECT</button>
          <button id="menuActionBtn" class="system-button" type="button">START</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const setBootStatus = (message) => {
      const bootStatus = document.getElementById("bootStatus");
      if (bootStatus) bootStatus.textContent = message;
    };
    window.addEventListener("error", (event) => {
      window.__bootError = `${event.message} @ ${event.filename}:${event.lineno}`;
      document.body.dataset.bootError = window.__bootError;
      setBootStatus(`부팅 오류: ${window.__bootError}`);
    });
    window.addEventListener("unhandledrejection", (event) => {
      window.__bootError = String(event.reason && event.reason.message ? event.reason.message : event.reason);
      document.body.dataset.bootError = window.__bootError;
      setBootStatus(`부팅 오류: ${window.__bootError}`);
    });
  </script>
  <script src="js/data/moveData.js"></script>
  <script src="js/data/pokemonData.js"></script>
  <script src="js/data/anilAdapter.js"></script>
  <script src="js/data/itemData.js"></script>
  <script src="js/data/ballData.js"></script>
  <script src="js/data/moveVisualAdapter.js"></script>
  <script src="js/data/upgradeData.js"></script>
  <script src="js/data/mapData.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/input.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/entities/entity.js"></script>
  <script src="js/entities/trainer.js"></script>
  <script src="js/entities/playerPokemon.js"></script>
  <script src="js/entities/wildPokemon.js"></script>
  <script src="js/systems/statSystem.js"></script>
  <script src="js/systems/movementSystem.js"></script>
  <script src="js/systems/combatSystem.js"></script>
  <script src="js/systems/captureSystem.js"></script>
  <script src="js/systems/spawnSystem.js"></script>
  <script src="js/systems/survivalSystem.js"></script>
  <script src="js/systems/partyBattleSystem.js"></script>
  <script src="js/systems/upgradeSystem.js"></script>
  <script src="js/ui/uiManager.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
